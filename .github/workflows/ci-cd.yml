name: .NET CI/CD

on:
  push:
    branches: [ "main", "master", "develop", "*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore API, tests and MVC
      run: |
        dotnet restore RaceDay.API/RaceDay.API.csproj
        dotnet restore RaceDay.API.Tests/RaceDay.API.Tests.csproj
        dotnet restore RaceDay.MVC/RaceDay.MVC.csproj

    - name: Build API
      run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

    - name: Build MVC
      run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - uses: actions/checkout@v4
    - name: Build MVC Docker image
      run: docker build -t raceday-mvc ./RaceDay.MVC
