<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceDay Management Portal</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <div class="container">
        <div class="dashboard-grid">
            <aside class="sidebar">
                <h2>RaceDay Portal</h2>
                <p class="text-muted">API Dashboard</p>
            </aside>
            <main class="main-content">
                <h1>Welcome to RaceDay API</h1>
                <p>System operational and ready for CRUD requests.</p>
                <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid var(--border-color);">

                <!-- Dynamic Interactive JavaScript Feature -->
                <div id="session-info" style="padding: 1rem; background: var(--bg-light); border-radius: var(--radius);">
                    <strong>Live System Session:</strong> <span id="live-clock">Loading time...</span>
                </div>
            </main>
        </div>
    </div>

    <!-- Custom Interactive JavaScript Script -->
    <script>
        function updateLiveClock() {
            const now = new Date();
            const options = {
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const formattedString = now.toLocaleDateString('en-US', options);

            const clockElement = document.getElementById('live-clock');
            if (clockElement) {
                clockElement.textContent = formattedString;
            }
        }

        // Initialize clock immediately and update every second
        updateLiveClock();
        setInterval(updateLiveClock, 1000);
    </script>
</body>
</html>
